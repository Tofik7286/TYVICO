<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>TYVICO — AI-First IT Services | Web, App & Software Development</title>
  <meta name="description"
    content="TYVICO builds websites, applications, AI systems, and custom software for businesses. AI-first approach, based in Ahmedabad, working globally." />
  <meta property="og:title" content="TYVICO — AI-First IT Services" />
  <meta property="og:description"
    content="We build websites, apps, and AI systems that actually work for your business." />
  <meta property="og:type" content="website" />

  <!-- Fonts: Inter from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Respect system theme preference before React hydrates -->
  <script>
    (function () {
      var saved = localStorage.getItem('tyvico-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
